trigger:
 branches:
   include:
     - master

# pool:
#   name: personal-vm
pool:
  vmImage: 'ubuntu-latest'

stages:

# BUILD STAGE
- stage: Build
  displayName: 'Build Stage'
  jobs:
    - job: BuildandPush
      displayName: 'Build Job'
      steps:
        - task: AzureKeyVault@2
          inputs:
            azureSubscription: 'Service-connection-Dev-003'
            KeyVaultName: 'secret-docker1'
            SecretsFilter: 'PORT'
            RunAsPreJob: true
         # name: FetchSecret


        - task: Docker@2
          inputs:
            containerRegistry: '$(ACR-Service-Connection)'
            command: 'login'
       
        - task: Docker@2
          inputs:
            containerRegistry: 'ACR-Connection-Dev-003'
            repository: '$(ImageName)'
            command: 'build'
            Dockerfile: 'Dockerfile'
            arguments: '--build-arg PORT=$(PORT)'
        
        - task: Docker@2
          inputs:
            containerRegistry: 'ACR-Connection-Dev-003'
            repository: '$(ImageName)'
            command: 'push'
      #  - task: Docker@2
       #   inputs:
        #    containerRegistry: '$(ACR-Service-Connection)'
         #   repository: '$(ImageName)'
          #  command: 'buildAndPush'
           # Dockerfile: 'Dockerfile'
           # buildContext: '$(Build.SourcesDirectory)'
           # tags: |
           #  $(Build.BuildId)
          #env:
           # PORT: $(PORT)
         
          
        - script: |
            python3.10 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
          displayName: 'Install dependencies'

    
- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  jobs:
    - job: Test
      displayName: 'Dependencies'
      steps:
        - script: |
            python3.10 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
          displayName: 'Run Tests'

# DEPLOY STAGE
- stage: DeployDev
  displayName: 'DeployToDev'
  dependsOn: Test
  condition: succeeded()
  jobs:
    - job: Deploy
      displayName: 'Deploy to Azure'
    - deployment: deployDevJob
      environment: Dev
      strategy:
       runOnce:
         deploy:
           steps:
             - task: AzureWebAppContainer@1
               inputs:
                 azureSubscription: '$(ServiceConnectionName)'
                 appName: '$(appService-dev-new)'
                 containers: '$(ImageName):$(Build.BuildId)'
                 

- stage: DeployProd
  displayName: 'DeployToProd'
  dependsOn: DeployDev
  condition: succeeded()
  jobs:
    - deployment: DeployProdJob
      environment: prod
      strategy: 
        runOnce:
          deploy:
            steps:
            
             - task: AzureWebAppContainer@1
               inputs:
                 azureSubscription: '$(ServiceConnectionName)'
                 appName: '$(appservice-prod)'
                 containers: '$(ImageName)'
