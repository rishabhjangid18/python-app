trigger:
- master

pool:
  name: Default

variables:
  pythonVersion: '3.11.9'

stages:

- stage: Build
  displayName: 'Build Stage'
  jobs:
    - job: Build
      displayName: 'Build Job'
      steps:

        - script: |
            sudo apt update
            sudo apt install -y wget build-essential libssl-dev zlib1g-dev \
              libbz2-dev libreadline-dev libsqlite3-dev curl llvm \
              libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev zip

            cd /tmp
            wget https://www.python.org/ftp/python/$(pythonVersion)/Python-$(pythonVersion).tgz
            tar -xf Python-$(pythonVersion).tgz
            cd Python-$(pythonVersion)
            ./configure --enable-optimizations
            make -j$(nproc)
            sudo make altinstall

            python3.11 --version
          displayName: 'Install Python 3.11'

        - script: |
            python3.11 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          displayName: 'Create venv & install dependencies'

        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
            replaceExistingArchive: true
          displayName: 'Archive application'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'
            publishLocation: 'Container'
          displayName: 'Publish Build Artifacts'

- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  jobs:
    - job: Test
      displayName: 'Run Tests'
      steps:
        - script: |
            python3.11 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Add your test commands here
            echo "Tests executed"
          displayName: 'Run tests in venv'

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Test
  condition: succeeded()
  jobs:
    - job: Deploy
      displayName: 'Deploy to Azure'
      steps:
        - download: current
          artifact: drop

        - task: AzureWebApp@1
          inputs:
            azureSubscription: 'DevOps-AppMod'
            appType: 'webAppLinux'
            appName: 'flask-cicd'
            package: '$(Pipeline.Workspace)/drop/app.zip'
            runtimeStack: 'PYTHON|3.11'
          displayName: 'Deploy to Azure App Service'
