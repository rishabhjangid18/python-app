name: Build and Deploy to Azure Web App via ACR

on:
  push:
    branches:
      - dev

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Log in to Azure Container Registry (ACR)
      run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Build and Push Docker Image to ACR
      run: |
        IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/${{ github.repository }}
        docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:${{ github.sha }}

    - name: Deploy to Azure Web App using Publish Profile
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ github.repository }}:latest
